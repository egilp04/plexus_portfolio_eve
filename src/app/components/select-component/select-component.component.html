<mat-form-field appearance="outline" class="full-width">
  <mat-label>{{ "SELECT.TITLE" | translate }}</mat-label>
  <mat-select
    [ngModel]="valorSeleccionado"
    (selectionChange)="onSelect($event)"
  >
    <mat-option value="">{{
      "PAGES.PROJECTS.FILTER.ALL" | translate
    }}</mat-option>
    @for (dat of data; track dat) {
      <mat-option [value]="dat.value">{{ dat.viewValue }}</mat-option>
    }
  </mat-select>
</mat-form-field>
